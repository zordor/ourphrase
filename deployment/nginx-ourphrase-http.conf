# Bootstrap virtual host for OurPhrase. Certbot adds the TLS listener after the
# first successful ACME validation; Cloudflare remains the public reverse proxy.
server {
    listen 80;
    listen [::]:80;
    server_name ourphrase.org www.ourphrase.org;

    root /var/www/ourphrase;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; connect-src 'none'" always;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /privacy {
        return 308 /privacy/;
    }

    location = /privacy/ {
        default_type text/html;
        try_files /privacy.html =404;
    }

    location /invite {
        try_files $uri $uri/ /invite/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
