<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>Invitación de OurPhrase</title>
  <style>
    :root{color-scheme:light dark;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
    body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f2f2f7;color:#1c1c1e}
    main{width:min(420px,calc(100% - 40px));text-align:center}
    .mark{width:92px;height:92px;border-radius:28px;display:grid;place-items:center;margin:auto;
      background:#175cf5;color:white;font-size:46px;box-shadow:0 18px 50px #175cf533}
    h1{font-size:34px;letter-spacing:-.6px;margin:28px 0 12px}
    p{color:#6e6e73;line-height:1.5;font-size:17px}
    a{display:block;background:#175cf5;color:#fff;text-decoration:none;padding:17px;border-radius:17px;
      font-weight:700;font-size:18px;margin-top:28px}
    small{display:block;color:#8e8e93;line-height:1.45;margin-top:18px}
    @media(prefers-color-scheme:dark){body{background:#000;color:#f2f2f7}p,small{color:#98989f}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>Te invitan a OurPhrase</h1>
    <p>Instala la app y vuelve a abrir este mismo enlace para completar la conexión.</p>
    <a id="open" href="https://ourphrase.org/invite">Abrir en OurPhrase</a>
    <small>La invitación permanece en este navegador. El secreto no se envía a ningún servidor.</small>
  </main>
  <script>
    // The fragment is never sent in HTTP. Keep it only in the link the user taps.
    const target = "https://ourphrase.org/invite" + location.hash;
    document.getElementById("open").href = target;
    try { sessionStorage.setItem("ourphrase.pendingInvite", location.hash); } catch {}
  </script>
</body>
</html>
